name: Deploy GitHub Pages
on:
  push:
    branches: [master]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_DEMO_MODE: "true"
          VITE_MSAL_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
          VITE_MSAL_TENANT_ID: "common"
          VITE_SHAREPOINT_SITE_HOST: "csgsystems.sharepoint.com"
          VITE_SHAREPOINT_SITE_PATH: "/sites/WoWCSGFitness"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
