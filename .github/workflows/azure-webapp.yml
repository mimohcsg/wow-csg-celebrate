name: Deploy shared Celebrate to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build shared frontend
        run: npm run build
        env:
          VITE_SHARED_MODE: "true"
          VITE_DEMO_MODE: "false"
          VITE_API_BASE: ""
          VITE_MSAL_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
          VITE_MSAL_TENANT_ID: "common"
          VITE_SHAREPOINT_SITE_HOST: "csgsystems.sharepoint.com"
          VITE_SHAREPOINT_SITE_PATH: "/sites/WoWCSGFitness"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: WoWCSGCelebrate
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
